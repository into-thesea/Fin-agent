[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.backends._legacy:_Backend"

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_functions = ["test_*"]
markers = [
    "slow: 慢速测试 (需要外部依赖)",
    "integration: 集成测试 (需要 Neo4j/Redis)",
    "unit: 纯单元测试 (默认)",
]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "W"]
ignore = [
    "E402",  # 模块级导入不在顶部 — 项目大量使用惰性导入(避免重型依赖在 import 时加载)
    "E501",  # 行太长 — 项目历史代码大量超 100 字符, 强行换行不现实
    "E741",  # 变量名歧义(如 l) — 列表推导式中常见, 改变量名风险大于收益
    "F841",  # 局部变量赋值未使用 — 多为调试/预留, 不影响功能
]

[tool.mypy]
python_version = "3.12"
ignore_missing_imports = true
follow_imports = "skip"
