# 智能客服系统 nginx 反向代理 (HTTPS)
# 用法: 复制到 /etc/nginx/sites-available/kefu, 改 server_name 后启用
# 证书由 certbot --nginx 自动补全 443 段。

# HTTP → HTTPS 跳转
server {
    listen 80;
    listen [::]:80;
    server_name kefu.example.com;   # ← 改成你的域名

    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# HTTPS 主配置
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name kefu.example.com;   # ← 改成你的域名

    # certbot 会自动填入证书路径
    # ssl_certificate     /etc/letsencrypt/live/kefu.example.com/fullchain.pem;
    # ssl_certificate_key /etc/letsencrypt/live/kefu.example.com/privkey.pem;

    # 反向代理到 FastAPI (单端口托管 API + 前端)
    location / {
        proxy_pass http://127.0.0.1:8001;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # SSE (流式问答) 需要关闭缓冲
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }
}
